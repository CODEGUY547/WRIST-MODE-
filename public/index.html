<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wrist Mode | Watches and Customized Jewelry</title>
    <meta
      name="description"
      content="Shop premium watches, women watches, wooden watches, and customized jewelry from Wrist Mode. Photo pendants, keyholders, bracelets, engraving, and personal accessories."
    />
    <link rel="icon" href="/assets/wrist-mode-mark.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <button class="menu-button" type="button" data-menu-toggle aria-label="Open navigation menu" aria-expanded="false" title="Open menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" aria-label="Main navigation">
        <button data-view="home">Home</button>
        <button data-view="watches">Watches</button>
        <button data-view="women">Ladies Watches</button>
        <button data-view="wooden">Wooden Watches</button>
        <button data-view="jewelry">Jewelry</button>
        <button data-view="customize">Custom Jewelry</button>
        <button data-view="faq">FAQ</button>
        <button class="menu-theme-toggle" type="button" data-theme-toggle aria-label="Switch theme"><span aria-hidden="true"></span>Theme</button>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light mode" title="Switch to light mode"><span aria-hidden="true"></span></button>
        <button class="cart-button" data-cart-toggle aria-label="Open shopping cart" title="Open shopping cart">
          <span class="cart-icon" aria-hidden="true"></span>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="page-shell site-footer-grid">
        <div>
          <p class="eyebrow">Wrist Mode</p>
          <p>Watches and personal jewelry selected for everyday style, gifts, and meaningful moments.</p>
        </div>
        <div class="footer-links" aria-label="Support links">
          <button data-view="about">About Wrist Mode</button>
          <button data-view="contact">Contact Wrist Mode</button>
          <button data-view="faq">Help Center</button>
        </div>
        <a class="footer-whatsapp" href="https://wa.me/256750668419" target="_blank" rel="noreferrer">Chat on WhatsApp</a>
      </div>
    </footer>

    <aside class="cart-drawer" id="cartDrawer" aria-label="Shopping cart">
      <div class="drawer-head">
        <div>
          <p class="eyebrow">Checkout</p>
          <h2>Your Cart</h2>
        </div>
        <button class="icon-button" data-cart-close aria-label="Close cart">x</button>
      </div>
      <div id="cartContent"></div>
    </aside>
    <div class="scrim" data-cart-close></div>

    <div id="modalRoot"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script src="/app.js"></script>
  </body>
</html>
