<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wrist Mode | Watches and Customized Jewelry</title>
    <meta
      name="description"
      content="Shop premium watches, women watches, wooden watches, and customized jewelry from Wrist Mode. Photo pendants, keyholders, bracelets, engraving, and personal accessories."
    />
    <link rel="icon" href="/assets/wrist-mode-mark.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <button class="brand-link" data-view="home" aria-label="Wrist Mode home">
        <img src="/assets/wrist-mode-mark.png" alt="" />
        <span>Wrist Mode</span>
      </button>
      <nav class="main-nav" aria-label="Main navigation">
        <button data-view="home">Home</button>
        <button data-view="watches">Watches</button>
        <button data-view="women">Women Watches</button>
        <button data-view="wooden">Wooden Watches</button>
        <button data-view="jewelry">Jewelry</button>
        <button data-view="customize">Customize</button>
        <button data-view="about">About</button>
        <button data-view="contact">Contact</button>
        <button data-view="faq">FAQ</button>
      </nav>
      <div class="header-actions">
        <button class="ghost-button" data-view="admin">Admin</button>
        <button class="cart-button" data-cart-toggle>
          Cart
          <span id="cartCount">0</span>
        </button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <aside class="cart-drawer" id="cartDrawer" aria-label="Shopping cart">
      <div class="drawer-head">
        <div>
          <p class="eyebrow">Checkout</p>
          <h2>Your Cart</h2>
        </div>
        <button class="icon-button" data-cart-close aria-label="Close cart">x</button>
      </div>
      <div id="cartContent"></div>
    </aside>
    <div class="scrim" data-cart-close></div>

    <div id="modalRoot"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script src="/app.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.js",
          "three/addons/": "/vendor/three/"
        }
      }
    </script>
    <script type="module" src="/studio3d.js"></script>
  </body>
</html>
